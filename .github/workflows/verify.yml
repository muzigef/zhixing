name: verify

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
          cache: npm
      # npm 11 has intermittently crashed in GitHub-hosted runners with
      # "Exit handler never called" during clean installs. Pin the installer;
      # package resolution remains locked by package-lock.json.
      - name: Pin npm installer
        run: npm install --global npm@10.9.2
      - name: Show runtime versions
        run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix desktop --no-audit --no-fund
      - name: Audit CLI production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit desktop production dependencies
        run: npm audit --prefix desktop --omit=dev --audit-level=high
      - run: npm run verify
      - run: npm --prefix desktop run test:ui

name: desktop-release
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify (tag releases always verify all platforms)
        type: choice
        default: all
        options: [all, macos-15, macos-15-intel, windows-2022]
      sign_macos:
        description: Sign and notarize macOS builds using configured repository secrets
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["macos-15","macos-15-intel","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    env:
      ZHIXING_DESKTOP_NATIVE_CIPHER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: node scripts/check-lockfiles.mjs
      - run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
      - run: npm ci --prefix desktop --no-audit --no-fund
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Audit CLI production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit desktop production dependencies
        run: npm audit --prefix desktop --omit=dev --audit-level=high
      - name: Verify release tag matches the desktop version
        run: node -e "if(process.env.GITHUB_REF?.startsWith('refs/tags/') && process.env.GITHUB_REF_NAME !== 'v'+require('./desktop/package.json').version) process.exit(1)"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm --prefix desktop run typecheck
      - name: Verify native Windows execution isolation
        if: runner.os == 'Windows'
        run: |
          node desktop/node_modules/electron/install.js
          node scripts/build-windows-sandbox.mjs
          npx vitest run tests/windows-sandbox.test.ts tests/platform-preflight.test.ts
      - name: Verify macOS learning and execution behavior before packaging
        if: runner.os == 'macOS'
        run: npm run verify
      - run: npm --prefix desktop run test:ui
      - run: npm --prefix desktop run dist:host
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ZHIXING_ALLOW_ADHOC: ${{ inputs.sign_macos && runner.os == 'macOS' && '0' || '1' }}
          ZHIXING_SIGN_MACOS: ${{ inputs.sign_macos && runner.os == 'macOS' && '1' || '0' }}
          CSC_LINK: ${{ inputs.sign_macos && runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.sign_macos && runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.sign_macos && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.sign_macos && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign_macos && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Install and verify Windows NSIS artifact
        if: runner.os == 'Windows'
        run: node desktop/scripts/install-windows-preview.mjs
      - name: Verify packaged application
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            executable="$GITHUB_WORKSPACE/$(find desktop/release -path '*/知行.app/Contents/MacOS/知行' -type f -print -quit)"
          else
            executable="$ZHIXING_DESKTOP_INSTALLED_EXECUTABLE"
          fi
          test -f "$executable"
          ZHIXING_DESKTOP_EXECUTABLE="$executable" npm --prefix desktop run test:ui
      - name: Verify signing and notarization
        if: inputs.sign_macos && runner.os == 'macOS'
        shell: bash
        run: |
          application="$(find desktop/release -name '知行.app' -type d -print -quit)"
          codesign --verify --deep --strict "$application"
          xcrun stapler validate "$application"
          spctl --assess --type execute "$application"
      - run: npm --prefix desktop run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/Zhixing-*.dmg
            desktop/release/Zhixing-*.zip
            desktop/release/Zhixing-*.exe
            desktop/release/SHA256SUMS-*.txt
            desktop/release/acceptance-windows.json
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --generate-notes --title "知行 $RELEASE_TAG"

name: desktop-release
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify (tag releases always verify all platforms)
        type: choice
        default: all
        options: [all, macos-15, macos-15-intel, windows-2022]
      channel:
        description: Preview or formal distribution (version tags always require formal signing)
        type: choice
        default: preview
        options: [preview, formal]
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["macos-15","macos-15-intel","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    env:
      ZHIXING_DESKTOP_NATIVE_CIPHER: '1'
      ZHIXING_RELEASE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'formal' || inputs.channel || 'preview' }}
    steps:
      - name: Keep identical source bytes across platform runners
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: node scripts/check-lockfiles.mjs
      - run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
      - run: npm ci --prefix desktop --no-audit --no-fund
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Audit CLI production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit desktop production dependencies
        run: npm audit --prefix desktop --omit=dev --audit-level=high
      - name: Verify release tag matches the desktop version
        run: node -e "if(process.env.GITHUB_REF?.startsWith('refs/tags/') && process.env.GITHUB_REF_NAME !== 'v'+require('./desktop/package.json').version) process.exit(1)"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm --prefix desktop run typecheck
      - name: Verify native Windows execution isolation
        if: runner.os == 'Windows'
        run: |
          node desktop/node_modules/electron/install.js
          node scripts/build-windows-sandbox.mjs
          npm run test:sandbox
      - name: Verify macOS learning and execution behavior before packaging
        if: runner.os == 'macOS'
        run: npm run verify
      - run: npm --prefix desktop run test:ui
      - run: npm --prefix desktop run dist:host
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ZHIXING_ALLOW_ADHOC: ${{ env.ZHIXING_RELEASE_CHANNEL == 'formal' && runner.os == 'macOS' && '0' || '1' }}
          ZHIXING_SIGN_MACOS: ${{ env.ZHIXING_RELEASE_CHANNEL == 'formal' && runner.os == 'macOS' && '1' || '0' }}
          CSC_LINK: ${{ env.ZHIXING_RELEASE_CHANNEL == 'formal' && runner.os == 'macOS' && secrets.MAC_CSC_LINK || env.ZHIXING_RELEASE_CHANNEL == 'formal' && runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ env.ZHIXING_RELEASE_CHANNEL == 'formal' && runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || env.ZHIXING_RELEASE_CHANNEL == 'formal' && runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ env.ZHIXING_RELEASE_CHANNEL == 'formal' && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.ZHIXING_RELEASE_CHANNEL == 'formal' && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.ZHIXING_RELEASE_CHANNEL == 'formal' && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Install and verify Windows NSIS artifact
        if: runner.os == 'Windows'
        run: node desktop/scripts/install-windows-preview.mjs
      - name: Verify packaged application
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            executable="$GITHUB_WORKSPACE/$(find desktop/release -path '*/知行.app/Contents/MacOS/知行' -type f -print -quit)"
          else
            executable="$ZHIXING_DESKTOP_INSTALLED_EXECUTABLE"
          fi
          test -f "$executable"
          ZHIXING_DESKTOP_EXECUTABLE="$executable" node desktop/scripts/verify-packaged-ui.mjs --output="desktop/release/packaged-ui-$RUNNER_OS-$RUNNER_ARCH.json"
      - name: Verify packaged native secure storage across process restart
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            executable="$GITHUB_WORKSPACE/$(find desktop/release -path '*/知行.app/Contents/MacOS/知行' -type f -print -quit)"
          else
            executable="$ZHIXING_DESKTOP_INSTALLED_EXECUTABLE"
          fi
          ZHIXING_DESKTOP_EXECUTABLE="$executable" node desktop/scripts/probe-secure-store.mjs --output="desktop/release/native-secure-store-$RUNNER_OS-$RUNNER_ARCH.json"
      - name: Gate exact release artifacts and native acceptance
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            executable="$GITHUB_WORKSPACE/$(find desktop/release -path '*/知行.app/Contents/MacOS/知行' -type f -print -quit)"
          else
            executable="$ZHIXING_DESKTOP_INSTALLED_EXECUTABLE"
          fi
          ZHIXING_DESKTOP_EXECUTABLE="$executable" node desktop/scripts/verify-release.mjs --ui="desktop/release/packaged-ui-$RUNNER_OS-$RUNNER_ARCH.json" --storage="desktop/release/native-secure-store-$RUNNER_OS-$RUNNER_ARCH.json" --output="desktop/release/release-acceptance-$RUNNER_OS-$RUNNER_ARCH.json"
      - run: npm --prefix desktop run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/Zhixing-*.dmg
            desktop/release/Zhixing-*.zip
            desktop/release/Zhixing-*.exe
            desktop/release/SHA256SUMS-*.txt
            desktop/release/acceptance-windows.json
            desktop/release/native-secure-store-*.json
            desktop/release/packaged-ui-*.json
            desktop/release/release-acceptance-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-failed-acceptance-${{ matrix.os }}
          path: |
            desktop/release/native-secure-store-*.json
            desktop/release/packaged-ui-*.json
            desktop/release/release-acceptance-*.json
          if-no-files-found: warn
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Require all formal platform receipts and unchanged artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node desktop/scripts/check-release-set.mjs artifacts
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --generate-notes --title "知行 $RELEASE_TAG"
